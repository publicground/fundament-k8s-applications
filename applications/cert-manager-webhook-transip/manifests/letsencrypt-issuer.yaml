apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-transip
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    # TODO: vervang door een echt team/beheer e-mailadres
    email: CHANGEME@publicground.nl
    privateKeySecretRef:
      name: letsencrypt-transip-account-key
    solvers:
      - dns01:
          webhook:
            groupName: acme.transip.nl
            solverName: transip
            config:
              # TODO: vervang door de daadwerkelijke TransIP accountnaam
              accountName: CHANGEME
              ttl: 300
              privateKeySecretRef:
                name: transip-secret
                key: privateKey
