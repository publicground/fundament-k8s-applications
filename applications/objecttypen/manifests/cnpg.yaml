apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: objecttypen-pg-cluster
  namespace: publicground
  annotations:
    # Delay until the cloudnative-pg operator's webhook has ready endpoints (same
    # reasoning as applications/cloudnative-pg/manifests/testcluster.yaml).
    argocd.argoproj.io/sync-wave: "5"
spec:
  instances: 1
  storage:
    size: "1Gi"
    # Cluster default StorageClass (metal-stack.io/csi-lvm). NOTE: as of this PR this
    # provisioner is failing with "create process timeout after 120 seconds" on the
    # fundament cluster (see the open csi-lvm diagnostics thread) — this Cluster's PVC
    # will likely stay Pending until that is fixed.
  bootstrap:
    initdb:
      database: "objecttypen"
      owner: "objecttypen"
