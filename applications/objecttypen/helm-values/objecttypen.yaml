# Adapted from poc-gzac/apps/objecttypen (655-dmn-poc): public docker.io image
# instead of the private acr655 mirror, OIDC removed (no Keycloak on fundament).
image:
  repository: maykinmedia/objecttypes-api

global:
  configuration:
    enabled: true
    overwrite: true
    secrets: {}

configuration:
  enabled: true
  overwrite: true
  superuser:
    username: "admin"
    email: "horstp@wigo4it.nl"
    # password field is ignored when existingSecret is set — OBJECTTYPE_SUPERUSER_PASSWORD must be
    # present as a key in the manually created "objecttypen" Secret (not committed to git, see PR description).
  initContainer:
    enabled: false
  job:
    enabled: false

tags:
  redis: false

replicaCount: 1

ingress:
  enabled: false  # Traffic enters via Gateway API HTTPRoute — see manifests/httproute.yaml

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "1024Mi"
    cpu: "250m"

existingSecret: objecttypen

extraEnvVars:
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: "objecttypen-pg-cluster-app"
        key: "password"

settings:
  allowedHosts: "objecttypen.fundament.publicground.nl"

  database:
    host: "objecttypen-pg-cluster-rw"
    port: 5432
    username: "objecttypen"
    name: "objecttypen"

  cache:
    default: "objecttypen-redis:6379/0"
    axes: "objecttypen-redis:6379/0"

  debug: false

  disable2fa: true

redis:
  enabled: false
