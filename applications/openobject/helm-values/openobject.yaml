# Adapted from poc-gzac/apps/openobject (655-dmn-poc): public docker.io image
# instead of the private acr655 mirror, OIDC/Keycloak integration removed (no
# Keycloak on fundament) — local admin auth only for now.
image:
  repository: maykinmedia/open-object

global:
  configuration:
    enabled: true
    overwrite: true
    secrets: {}

configuration:
  enabled: true
  overwrite: true
  superuser:
    username: "admin"
    email: "horstp@wigo4it.nl"
    # password field is ignored when existingSecret is set — OBJECTS_SUPERUSER_PASSWORD must be
    # present as a key in the manually created "openobject" Secret (not committed to git, see PR description).
  initContainer:
    enabled: false
  job:
    enabled: false

tags:
  redis: false

replicaCount: 1

ingress:
  enabled: false  # Traffic enters via Gateway API HTTPRoute — see manifests/httproute.yaml

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "1024Mi"
    cpu: "250m"

persistence:
  enabled: false

existingSecret: openobject

extraEnvVars:
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: "openobject-pg-cluster-app"
        key: "password"

settings:
  allowedHosts: "openobject.fundament.publicground.nl"

  disable2fa: true

  database:
    host: "openobject-pg-cluster-rw"
    port: 5432
    username: "openobject"
    name: "openobject"

  siteDomain: "openobject.fundament.publicground.nl"

  cache:
    default: "openobject-redis:6379/0"
    axes: "openobject-redis:6379/0"
    oidc: "openobject-redis:6379/0"

  celery:
    brokerUrl: "redis://openobject-redis:6379/1"
    resultBackend: "redis://openobject-redis:6379/1"
    resultBackendl: "redis://openobject-redis:6379/1"

  isHttps: true

worker:
  replicaCount: 1
  livenessProbe:
    enabled: true

redis:
  enabled: false
