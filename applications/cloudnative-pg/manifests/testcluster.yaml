apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-test-cluster
  namespace: cloudnative-pg
  annotations:
    # Delay applying this Cluster CR until after the operator's Deployment (wave 0,
    # default) is healthy. Without this, ArgoCD applies the Cluster CR in the same
    # wave as the operator Deployment/webhook Service, and the mutating webhook
    # ("mcluster.cnpg.io") has no ready endpoints yet, causing:
    # "no endpoints available for service cnpg-webhook-service".
    argocd.argoproj.io/sync-wave: "5"
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4

  affinity:
    nodeSelector:
      kubernetes.io/hostname: shoot--wigo4ib985--wigo4itfe39-funoe584-5885f-zrkcf

  bootstrap:
    initdb:
      database: pgtestdb
      owner: my-test-db-owner
      # secret:
      #   name: my-test-db-secret # This tells operator to USE an existing secret, not CREATE it

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  storage:
    size: 1Gi
    storageClass: local-hostpath
