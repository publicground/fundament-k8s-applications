apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: cloudnative-pg
    repo: https://cloudnative-pg.github.io/charts
    version: "0.29.0"
    releaseName: cloudnative-pg
    namespace: cloudnative-pg
    valuesFile: helm-values/cloudnative-pg.yaml

resources:
  - manifests

# Satisfies the kyverno require-labels ClusterPolicy (checks resource metadata.labels)
labels:
  - pairs:
      app.kubernetes.io/part-of: cloudnative-pg
    includeSelectors: false
