apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: redis-operator
    repo: https://ot-container-kit.github.io/helm-charts/
    version: "0.24.0"
    releaseName: redis-operator
    namespace: redis-operator
    valuesFile: helm-values/redis-operator.yaml
    includeCRDs: true

patches:
  # CRDs in charts' crds/ dir are invisible to helm template unless includeCRDs: true.
  # Replace=true lets ArgoCD take ownership without field-manager conflicts from the
  # initial Helm install, and handles breaking schema changes (e.g. v2alpha1 → v2beta1).
  - target:
      kind: CustomResourceDefinition
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-options
        value: Replace=true