# NOTE: this chart uses 'replicas' (not 'replicaCount') as the key — using
# 'replicaCount' is silently ignored by the OT Container Kit chart.
redisOperator:
  prometheusMetrics:
    enabled: true
replicas: 1
serviceMonitor:
  enabled: false
  interval: 30s
  labels:
    redis-operator: "true"
# Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
# Container security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL
updateStrategy:
  type: RollingUpdate