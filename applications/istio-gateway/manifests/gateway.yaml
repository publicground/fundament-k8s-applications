apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway
  namespace: istio-system
spec:
  gatewayClassName: istio
  infrastructure:
    annotations:
      service.beta.kubernetes.io/azure-load-balancer-internal: "true"
      service.beta.kubernetes.io/port_443_health-probe_protocol: "HTTP"
      service.beta.kubernetes.io/port_443_health-probe_port: "15021"
      service.beta.kubernetes.io/port_443_health-probe_request-path: "/healthz/ready"
      service.beta.kubernetes.io/port_80_health-probe_protocol: "HTTP"
      service.beta.kubernetes.io/port_80_health-probe_port: "15021"
      service.beta.kubernetes.io/port_80_health-probe_request-path: "/healthz/ready"
      external-dns.alpha.kubernetes.io/hostname: "*.fundament-npr.intern.publicground.nl"
    parametersRef:
      group: ""
      kind: ConfigMap
      name: gateway-options
  listeners:
    - name: https
      hostname: "*.fundament-npr.intern.publicground.nl"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: http
      hostname: "*.fundament-npr.intern.publicground.nl"
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
---
# Cluster-wide HTTP → HTTPS redirect
# Individual app HTTPRoutes only need to attach to the `https` listener.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-redirect
  namespace: istio-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway
      namespace: istio-system
      sectionName: http
  hostnames:
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
      matches:
        - path:
            type: PathPrefix
            value: /
