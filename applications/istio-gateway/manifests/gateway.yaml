apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway
  namespace: istio-system
spec:
  gatewayClassName: istio
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: gateway-options
  listeners:
    - name: https
      hostname: "argocd.fundament.publicground.nl"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: argocd-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: http
      hostname: "*.fundament.publicground.nl"
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: https-objecttypen
      hostname: "objecttypen.fundament.publicground.nl"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: objecttypen-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: https-openobjecten
      hostname: "openobjecten.fundament.publicground.nl"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: openobjecten-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: https-openobject
      hostname: "openobject.fundament.publicground.nl"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: openobject-tls
      allowedRoutes:
        namespaces:
          from: All
---
# Cluster-wide HTTP → HTTPS redirect
# Individual app HTTPRoutes only need to attach to the `https` listener.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-redirect
  namespace: istio-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway
      namespace: istio-system
      sectionName: http
  hostnames:
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
      matches:
        - path:
            type: PathPrefix
            value: /
