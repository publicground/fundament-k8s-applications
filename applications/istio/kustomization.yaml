apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: base
    repo: https://istio-release.storage.googleapis.com/charts
    version: "1.30.3"
    releaseName: istio-base
    namespace: istio-system
    includeCRDs: true
    valuesFile: helm-values/base.yaml

  - name: istiod
    repo: https://istio-release.storage.googleapis.com/charts
    version: "1.30.3"
    releaseName: istiod
    namespace: istio-system
    valuesFile: helm-values/istiod.yaml

  - name: cni
    repo: https://istio-release.storage.googleapis.com/charts
    version: "1.30.3"
    releaseName: istio-cni
    namespace: istio-system
    valuesFile: helm-values/cni.yaml

  - name: ztunnel
    repo: https://istio-release.storage.googleapis.com/charts
    version: "1.30.3"
    releaseName: ztunnel
    namespace: istio-system
    valuesFile: helm-values/ztunnel.yaml
