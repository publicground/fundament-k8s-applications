apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Gateway API has no standalone Helm chart — install CRDs directly from the release manifest.
# Use experimental-install.yaml instead if TLSRoute/TCPRoute/UDPRoute are needed.
# to upgrade, download standard-install.yaml of latest release from https://github.com/kubernetes-sigs/gateway-api/releases/
# and replace standard-install.yaml in this directory
resources:
  - manifests # mirror from https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.1/standard-install.yaml
